name: Parallel test trial (temporary)

# Temporary: measures the suite under pytest-xdist on this branch only.
# Removed before the branch is merged.

on:
  push:
    branches: [claude/ci-parallel-tests]

permissions:
  contents: read

jobs:
  trial:
    name: pytest -n auto --dist ${{ matrix.dist }} (run ${{ matrix.run }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dist: [load, loadfile]
        run: [1, 2]
    steps:
      - name: Check out backend
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: stoa-backend
          fetch-depth: 0
          persist-credentials: false

      - name: Check out frontend
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: stoasystem/stoa-frontend
          path: stoa-frontend
          persist-credentials: false

      - name: Check out infra
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: stoasystem/stoa-infra
          path: stoa-infra
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.12.13

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.16
          enable-cache: false

      - name: Install locked dependencies
        working-directory: stoa-backend
        run: uv sync --frozen --extra dev

      - name: CPU count
        run: nproc

      - name: Run test suite in parallel
        working-directory: stoa-backend
        run: uv run pytest -q -n auto --dist ${{ matrix.dist }} --durations=30
